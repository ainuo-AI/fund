<!DOCTYPE html>
<!-- base.html：所有页面共用的骨架。子模板只填 content 区块。 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}基金信息站{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="/">📈 基金信息站</a>
        <form class="nav-search" action="/search" method="get">
            <input type="text" name="q" placeholder="输入基金名称或代码，如：白酒 / 161725"
                   value="{{ keyword or '' }}">
            <button type="submit">搜索</button>
        </form>
    </nav>

    <main class="container">
        <!-- 返回上一页：包在 block 里，子模板（如首页）可以覆盖为空来隐藏它 -->
        {% block back_button %}
        <button class="back-btn" onclick="goBack()">← 返回上一页</button>
        {% endblock %}
        {% block content %}{% endblock %}
    </main>

    <script>
        function goBack() {
            // history.length > 1 说明当前标签页里有上一页可以回退
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '/';
            }
        }
    </script>

    <footer class="footer">
        数据来源于公开接口，仅供参考，不构成投资建议
    </footer>
</body>
</html>
