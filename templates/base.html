<!DOCTYPE html>
<!-- base.html：所有页面共用的骨架。子模板只填 content 区块。 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}基金信息站{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="/">📈 基金信息站</a>
        <form class="nav-search" action="/search" method="get">
            <input type="text" name="q" placeholder="输入基金名称或代码，如：白酒 / 161725"
                   value="{{ keyword or '' }}">
            <button type="submit">搜索</button>
        </form>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        数据来源于公开接口，仅供参考，不构成投资建议
    </footer>
</body>
</html>
